  <g fill="#ffffff">
    <!-- logomark: stacked rounded bars + dot forming an "F" -->
    <rect x="190" y="176" width="120" height="40" rx="20"/>
    <rect x="190" y="232" width="92" height="40" rx="20"/>
    <circle cx="214" cy="312" r="24"/>
    <!-- wordmark -->
    <text x="350" y="296" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="112" font-weight="600" letter-spacing="-1">Flipcash</text>
  </g>
</svg>

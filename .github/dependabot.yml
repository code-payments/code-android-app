version: 2
updates:
- package-ecosystem: gradle
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
    - "dependencies"
    - "type: build"
  target-branch: code/cash
  reviewers:
  - bmc08gt
  assignees:
  - bmc08gt
  ignore:
    # Each version is the exact android-all build a Robolectric release loads for one SDK level
    # (see the robolectric-sdk* entries in libs.versions.toml). They move with Robolectric, not on
    # their own; "newer" builds belong to other SDK levels.
    - dependency-name: "org.robolectric:android-all-instrumented"

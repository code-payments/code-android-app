name: CI

# Two tiers.
#
# PR tier (pull_request, merge_group, push to code/cash): "Unit tests" and "Lint". These are the
# checks proposed as required. Their names must stay identical on every event: a required check
# that does not report on `merge_group` stalls the queue.
#
# Queue tier (merge_group, workflow_dispatch): "Vector instrumented tests", which needs an
# emulator and so is too slow for every PR push.
#
# The push trigger exists to warm the Gradle build cache. Only runs on code/cash write the cache;
# A manual workflow_dispatch also writes, to warm a branch. PR and merge-queue runs read it, so a PR re-executes only the tasks its diff invalidates.
on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      live:
        description: 'OCP SDK checks: make the live read call to the production OCP server'
        type: boolean
        default: false
  # Nightly live read for "OCP SDK checks". Unit tests and Lint skip this event.
  schedule:
    - cron: '17 9 * * *'
  push:
    branches:
      - code/cash

concurrency:
  # Cancel superseded pushes to a PR branch. Queue entries are distinct refs and must never
  # cancel each other. Everything else gets a unique group.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  unit-tests:
    name: Unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Cheap supply-chain guard: fails the run if gradle/wrapper/gradle-wrapper.jar
      # is not a byte-for-byte match for a jar published by Gradle.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java env
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      # Restores ~/.gradle including the local build cache. Writes only from code/cash.
      # With an encryption key, setup-gradle also saves and restores the configuration cache,
      # which otherwise starts empty on every run ("no cached configuration is available").
      # The entry holds the provisioned API keys, hence the encryption. Without the secret
      # (forks, Dependabot) setup-gradle skips the configuration cache and carries on.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Provision config
        uses: ./.github/actions/provision-config
        with:
          google-services: ${{ secrets.FLIPCASH2_GOOGLE_SERVICES }}
          bugsnag-api-key: ${{ secrets.FLIPCASH_BUGSNAG_API_KEY }}
          google-cloud-project-number: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
          mixpanel-api-key: ${{ secrets.FLIPCASH_MIXPANEL_API_KEY }}
          coinbase-onramp-api-key: ${{ secrets.COINBASE_ONRAMP_API_KEY }}

      # Same tasks as the `flipcash_tests` fastlane lane minus lint, without the Ruby setup.
      # kotlinStorePackageLock fails when kotlin-js-store/package-lock.json no longer matches the
      # JS dependencies. jsNodeTest runs every module's common tests on Node (the Kotlin Gradle
      # plugin downloads Node from nodejs.org on first use).
      #
      # Heap caps for this job. The runner has 16 GB. With gradle.properties' -Xmx6g, the Gradle
      # daemon and each Kotlin daemon (which inherits it) may grow to 6 GB, beside up to four 2 GB
      # test JVMs. On #1996 that filled RAM and swap: the runner was shut down twice and a third run
      # swapped until a timing-sensitive test failed. These caps keep the peak inside the runner.
      - name: Run unit tests
        run: >-
          ./gradlew
          -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-XX:MaxMetaspaceSize=1g -Dlint.nullness.ignore-deprecated=true"
          "-Pkotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
          generateEmojiList kotlinStorePackageLock jsNodeTest flipcashTestDebug

  # Not proposed as required: the smoke step calls the production OCP server, so a server blip
  # must not block merges. Covers the platform-neutral OCP modules outside "Unit tests":
  #   - checkServiceDependencies: :services:* modules other than the app-facing ones stay free of
  #     apps/, ui/, DI, Room, analytics and Firebase.
  #   - jvmTest: their JVM suites, plus :services:opencode's fixture tests, which pin the bytes
  #     protobuf-java sends today. The Wire side of that parity runs on Node in "Unit tests".
  #   - Node smoke: plain `node` loads the Kotlin/JS library build of :services:opencode-client.
  #     The read call to production (rates over StreamLiveMintData) is opt-in: it runs on the
  #     nightly schedule, on workflow_dispatch with live: true, and on PRs labelled ocp-live.
  #     The label is read from the event payload, so adding it takes effect on the next push,
  #     not on a re-run. Every other run only checks that the library loads.
  ocp-sdk:
    name: OCP SDK checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java env
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Provision config
        uses: ./.github/actions/provision-config
        with:
          google-services: ${{ secrets.FLIPCASH2_GOOGLE_SERVICES }}
          bugsnag-api-key: ${{ secrets.FLIPCASH_BUGSNAG_API_KEY }}
          google-cloud-project-number: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
          mixpanel-api-key: ${{ secrets.FLIPCASH_MIXPANEL_API_KEY }}
          coinbase-onramp-api-key: ${{ secrets.COINBASE_ONRAMP_API_KEY }}

      - name: Check service boundaries and run JVM suites
        run: >-
          ./gradlew checkServiceDependencies
          :services:opencode:jvmTest
          :services:opencode-model:jvmTest
          :services:opencode-solana:jvmTest
          :services:opencode-transport:jvmTest
          :services:opencode-intents:jvmTest
          :services:opencode-client:jvmTest
          :services:flipcash-chat:jvmTest
          :services:flipcash-client:jvmTest

      # The chat cipher and the Flipcash chat and client libraries on Node: libsodium (WASM) and
      # Ed25519 over @noble/ed25519, the vectors, and canonical signing parity with protobuf-java.
      - name: Run the Flipcash chat suites on Node
        run: >-
          ./gradlew
          :libs:encryption:chat-cipher:jsNodeTest
          :services:flipcash-chat:jsNodeTest
          :services:flipcash-client:jsNodeTest

      - name: Build the opencode-client JS library
        run: ./gradlew kotlinNpmInstall :services:opencode-client:jsNodeProductionLibraryDistribution

      - name: Node smoke test
        env:
          OCP_LIVE: >-
            ${{ (github.event_name == 'schedule'
            || (github.event_name == 'workflow_dispatch' && inputs.live)
            || contains(github.event.pull_request.labels.*.name, 'ocp-live')) && '1' || '0' }}
          # The library's npm dependencies (@grpc/grpc-js, @noble/*) are installed in the root
          # project's Kotlin/JS node_modules, not next to the distribution.
          NODE_PATH: ${{ github.workspace }}/build/js/node_modules
        run: >-
          node services/opencode-client/node-smoke/smoke.cjs
          services/opencode-client/build/dist/js/productionLibrary/Flipcash-services-opencode-client.js

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java env
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Provision config
        uses: ./.github/actions/provision-config
        with:
          google-services: ${{ secrets.FLIPCASH2_GOOGLE_SERVICES }}
          bugsnag-api-key: ${{ secrets.FLIPCASH_BUGSNAG_API_KEY }}
          google-cloud-project-number: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
          mixpanel-api-key: ${{ secrets.FLIPCASH_MIXPANEL_API_KEY }}
          coinbase-onramp-api-key: ${{ secrets.COINBASE_ONRAMP_API_KEY }}

      - name: Run lint
        run: ./gradlew generateEmojiList :apps:flipcash:app:lintDebug

  # Queue tier. Three androidTest suites need a device (JNI or Android-framework deps):
  #   - :libs:encryption:ed25519  (JNI + android.util.Base64)
  #   - :libs:encryption:mnemonic (wordlist in res/raw + JNI ed25519)
  #   - :libs:currency-math       (loads .bin tables from assets)
  # The host-JVM vector suites already run in "Unit tests" via flipcashTestDebug.
  vector-instrumented-tests:
    name: Vector instrumented tests
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java env
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Provision config
        uses: ./.github/actions/provision-config
        with:
          google-services: ${{ secrets.FLIPCASH2_GOOGLE_SERVICES }}
          bugsnag-api-key: ${{ secrets.FLIPCASH_BUGSNAG_API_KEY }}
          google-cloud-project-number: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
          mixpanel-api-key: ${{ secrets.FLIPCASH_MIXPANEL_API_KEY }}
          coinbase-onramp-api-key: ${{ secrets.COINBASE_ONRAMP_API_KEY }}

      # Hosted Linux runners expose /dev/kvm only to the runner user after this rule is applied.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run vector instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >
            ./gradlew
            :libs:encryption:mnemonic:connectedAndroidDeviceTest
            :libs:currency-math:connectedAndroidTest
            --continue

      - name: Upload device test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vector-device-test-reports
          path: |
            libs/encryption/mnemonic/build/reports/androidTests
            libs/encryption/mnemonic/build/outputs/androidTest-results
            libs/currency-math/build/reports/androidTests
            libs/currency-math/build/outputs/androidTest-results
          if-no-files-found: ignore

name: Flipcash dApp Store Publish

# Publishes Play production to the Solana dApp Store. bump-patch.yml pushes the release manifest
# with BOT_GITHUB_TOKEN, and that push starts this workflow; `check` lets it through only when
# production is ahead of what the dApp Store last received.

on:
  push:
    branches:
      - code/cash
    paths:
      - .well-known/release-manifest.json
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish Play production even if the manifest says the dApp Store already has it'
        required: false
        type: boolean
        default: false

concurrency:
  group: dapp-store-publish
  cancel-in-progress: false

jobs:
  check:
    name: Compare Play production with the dApp Store
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: code/cash

      - name: Compare versionCodes
        id: compare
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          PROD=$(jq -r '.tracks.production.versionCode // empty' .well-known/release-manifest.json)
          DAPP=$(jq -r '.dappStore.versionCode // empty' .well-known/release-manifest.json)
          echo "Play production: ${PROD:-<none>} | dApp Store: ${DAPP:-<none>}"
          if [ -z "$PROD" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" = "true" ] || [ -z "$DAPP" ] || [ "$PROD" -gt "$DAPP" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to the Solana dApp Store
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: dapp-store
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: code/cash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/flipcash/app/dapp_publishing/pnpm-lock.yaml

      - name: Decode Service Account Key JSON file
        uses: timheuer/base64-to-file@v1
        id: service_account_json_file
        with:
          fileName: serviceAccount.json
          encodedString: ${{ secrets.FLIPCASH_SERVICE_ACCOUNT_KEY_JSON }}

      - name: Decode dApp Store signer keypair
        uses: timheuer/base64-to-file@v1
        id: dapp_keypair
        with:
          fileName: dappStoreKeypair.json
          encodedString: ${{ secrets.DAPP_STORE_KEYPAIR_JSON }}

      - name: Download the Play-signed universal APK
        id: apk
        env:
          SERVICE_ACCOUNT_KEY_JSON: ${{ steps.service_account_json_file.outputs.filePath }}
        run: bash scripts/download-play-universal-apk.sh

      - name: Publish
        env:
          DAPP_STORE_API_KEY: ${{ secrets.DAPP_STORE_API_KEY }}
          DAPP_STORE_KEYPAIR_PATH: ${{ steps.dapp_keypair.outputs.filePath }}
        run: |
          bash scripts/dapp-store-publish.sh \
            "${{ steps.apk.outputs.apk_path }}" \
            "${{ steps.apk.outputs.version_code }}" \
            "${{ steps.apk.outputs.notes_path }}"

      - name: Record the publish in the release manifest
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .well-known/release-manifest.json
          git commit -m "build: record Flipcash ${{ steps.apk.outputs.version_code }} on the Solana dApp Store"
          git pull --rebase https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git code/cash
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:code/cash

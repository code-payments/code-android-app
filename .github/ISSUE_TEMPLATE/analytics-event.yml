name: Analytics event
description: Ask for a new analytics event, or a change to one we already send.
title: "Analytics: "
labels: ["analytics"]
body:
  - type: markdown
    attributes:
      value: |
        This form is optional. Every event lives in
        [`libs/analytics-events/events.toml`](https://github.com/code-payments/code-android-app/blob/code/cash/libs/analytics-events/events.toml),
        and anyone can add or change one there in a pull request instead; the comments at the top
        of that file say how. [`EVENTS.md`](https://github.com/code-payments/code-android-app/blob/code/cash/libs/analytics-events/EVENTS.md),
        next to it, lists every event we send today.

  - type: dropdown
    id: kind
    attributes:
      label: New or changed?
      options:
        - A new event
        - A change to an event we already send
    validations:
      required: true

  - type: input
    id: existing
    attributes:
      label: Existing event
      description: For a change, a link to the event's entry in EVENTS.md.
      placeholder: https://github.com/code-payments/code-android-app/blob/code/cash/libs/analytics-events/EVENTS.md#...

  - type: input
    id: name
    attributes:
      label: Event name
      description: The name exactly as it should appear in Mixpanel.
      placeholder: "Chat: Sent Message"
    validations:
      required: true

  - type: textarea
    id: when
    attributes:
      label: When it's sent
      description: What the user does, or what happens in the app, that sends it.
    validations:
      required: true

  - type: textarea
    id: properties
    attributes:
      label: Properties
      description: |
        One per line: the name Mixpanel shows, a type, and an example value. Types are text,
        yes/no, count (a whole number), decimal, duration (milliseconds), or the name of a list
        in EVENTS.md. Say if the app may leave one out.
      placeholder: |
        Chat Type | ChatType | Group
        Message Length | count | 42
        Error | text | Network timeout (optional)
    validations:
      required: false

  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: Android
        - label: iOS

  - type: textarea
    id: why
    attributes:
      label: Why it's needed
      description: The question this event would answer.
    validations:
      required: true

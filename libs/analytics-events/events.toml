package = "com.flipcash.analytics"

# Chat

[enums.ChatType]
doc = "The `Chat Type` property."

[enums.ChatType.cases]
CONTACT = "Contact"
TIP = "Tip"
GROUP = "Group"
UNKNOWN = "Unknown"

[[domains.ChatEvents.events]]
builder = "sentMessage"
event = "Sent Message"
params = ["chatType: ChatType", "error: String?"]
properties = [
  { key = "Chat Type", value = "chatType" },
  { key = "Error", value = "error" },
]

[[domains.ChatEvents.events]]
builder = "tipReceived"
event = "Tip Received"
params = ["chatType: ChatType", "amount: Amount"]
properties = [
  { key = "Chat Type", value = "chatType" },
  { group = "amount" },
]
drift = "iOS sends Exchange Rate and no USDC (see Amount)."

[[domains.ChatEvents.events]]
builder = "messageReceived"
event = "Message Received"
params = ["chatType: ChatType"]
properties = [{ key = "Chat Type", value = "chatType" }]

# Transfers

[enums.State]
doc = "The `State` property on an event that reports an outcome."

[enums.State.cases]
SUCCESS = "Success"
FAILURE = "Failure"

[enums.CashLinkChoice.cases]
COPIED = "Copied to clipboard"
SHARED = "Shared to app"

# State, then the amount, then Error: the block every outcome event ends with.
[groups.outcome]
properties = [
  { key = "State", value = "state" },
  { group = "amount" },
  { key = "Error", value = "error" },
]

[[domains.TransferEvents.events]]
builder = "grabBillStart"
event = "Grab Bill Start"

[[domains.TransferEvents.events]]
builder = "giveBillStart"
event = "Give Bill Start"

[[domains.TransferEvents.events]]
builder = "grabBill"
event = "Grab Bill"
params = ["state: State", "amount: Amount?", "grabTimeMillis: Long?", "error: String?"]
properties = [
  { key = "Grab Time", value = "grabTimeMillis" },
  { group = "outcome" },
]
drift = "iOS sends Grab Time in seconds, not milliseconds, and on failure sends only Fiat and Currency of the amount (see Amount)."

[[domains.TransferEvents.events]]
builder = "giveBill"
event = "Give Bill"
params = ["state: State", "amount: Amount?", "error: String?"]
properties = [{ group = "outcome" }]
drift = "iOS sends Exchange Rate and no USDC (see Amount)."

[[domains.TransferEvents.events]]
builder = "withdrawal"
event = "Withdrawal"
params = ["state: State", "amount: Amount?", "error: String?"]
properties = [{ group = "outcome" }]
drift = "iOS sends Exchange Rate and no USDC (see Amount)."

[[domains.TransferEvents.events]]
builder = "sendCashLink"
event = "Send Cash Link"
params = ["state: State", "amount: Amount?", "choice: CashLinkChoice?", "app: String?", "error: String?"]
properties = [
  { key = "Cash Link Choice", value = "choice" },
  { key = "App", value = "app" },
  { group = "outcome" },
]
drift = "iOS sends no Cash Link Choice or App, and sends Exchange Rate and no USDC (see Amount). Android never sends Failure."

[[domains.TransferEvents.events]]
builder = "receiveCashLink"
event = "Receive Cash Link"
params = ["state: State", "amount: Amount?", "error: String?"]
properties = [{ group = "outcome" }]
drift = "iOS sends Exchange Rate and no USDC (see Amount)."

[[domains.TransferEvents.events]]
builder = "sentCash"
event = "Sent Cash"
params = ["state: State", "amount: Amount?", "error: String?"]
properties = [{ group = "outcome" }]
drift = "iOS sends Exchange Rate and no USDC (see Amount)."

[[domains.TransferEvents.events]]
builder = "sentTip"
event = "Sent Tip"
params = ["state: State", "amount: Amount?", "error: String?"]
properties = [{ group = "outcome" }]
drift = "iOS sends Exchange Rate and no USDC (see Amount)."

# Add money

[enums.AddMoneySource.cases]
MENU = "Menu"
GIVE_SHORTFALL = "Give Shortfall"
BUY_SHORTFALL = "Buy Shortfall"
USERNAME_SHORTFALL = "Username Shortfall"
CHAT = "Chat"
SCANNER = "Scanner"
BALANCE = "Balance"

[enums.AddMoneyMethod.cases]
COINBASE = "Coinbase"
PHANTOM = "Phantom"
OTHER_WALLET = "Other Wallet"
RESERVES = { value = "Reserves", drift = "iOS has no Reserves method." }

[[domains.AddMoneyEvents.events]]
builder = "opened"
event = "Add Money: Opened"
params = ["source: AddMoneySource"]
properties = [{ key = "Source", value = "source" }]

[[domains.AddMoneyEvents.events]]
builder = "methodSelected"
event = "Add Money: Method Selected"
params = ["method: AddMoneyMethod"]
properties = [{ key = "Method", value = "method" }]
drift = "iOS has no Reserves method."

[[domains.AddMoneyEvents.events]]
builder = "amountConfirmed"
event = "Add Money: Amount Confirmed"
params = ["method: AddMoneyMethod", "amount: Amount"]
properties = [
  { key = "Method", value = "method" },
  { group = "amount" },
]
drift = "iOS sends Exchange Rate and no USDC (see Amount)."

[[domains.AddMoneyEvents.events]]
builder = "paymentInvoked"
event = "Add Money: Payment Invoked"
params = ["method: AddMoneyMethod", "amount: Amount"]
properties = [
  { key = "Method", value = "method" },
  { group = "amount" },
]
drift = "iOS sends Exchange Rate and no USDC (see Amount). Android's USDC carries the native amount here."

[[domains.AddMoneyEvents.events]]
builder = "addressCopied"
event = "Add Money: Address Copied"
params = ["mint: String"]
properties = [{ key = "Mint", value = "mint" }]

[[domains.AddMoneyEvents.events]]
builder = "result"
event = "Add Money"
params = ["method: AddMoneyMethod", "state: State", "amount: Amount?", "error: String?"]
properties = [
  { key = "Method", value = "method" },
  { group = "outcome" },
]
doc = "The outcome of an add-money flow, sent as the event named `Add Money`."
drift = "iOS sends Exchange Rate and no USDC (see Amount)."

# Onramp

[enums.OnrampStep.cases]
SHOW_INFO = "Show Verification Info"
ENTER_PHONE = "Show Enter Phone"
CONFIRM_PHONE = "Show Confirm Phone"
ENTER_EMAIL = "Show Enter Email"
CONFIRM_EMAIL = "Show Confirm Email"

[[domains.OnrampEvents.events]]
builder = "step"
event = "Onramp: {step}"
params = ["step: OnrampStep"]
doc = "Show Verification Info is Android only; part 2 decides whether iOS sends it."

# Wallet

[enums.WalletProvider.cases]
PHANTOM = "Phantom"

[domains.WalletEvents]
doc = "The Phantom deeplink flow."

[[domains.WalletEvents.events]]
builder = "connect"
event = "Wallet: Connect"
params = ["provider: WalletProvider"]
properties = [{ key = "Provider", value = "provider" }]
drift = "iOS sends no Provider, and fires on the request rather than after connecting."

[[domains.WalletEvents.events]]
builder = "requestAmount"
event = "Wallet: Request Amount"
params = ["provider: WalletProvider", "amount: Amount"]
properties = [
  { key = "Provider", value = "provider" },
  { group = "amount" },
]
drift = "iOS sends no Provider, and sends only Fiat (the native amount) and Currency where Android sends the token amount's block (see Amount)."

[[domains.WalletEvents.events]]
builder = "transactionsFailed"
event = "Wallet: Transactions Failed"
params = ["provider: WalletProvider"]
properties = [{ key = "Provider", value = "provider" }]
drift = "iOS declares this with no Provider and never sends it."

[[domains.WalletEvents.events]]
builder = "cancel"
event = "Wallet: Cancel"
params = ["provider: WalletProvider"]
properties = [{ key = "Provider", value = "provider" }]
drift = "iOS sends no Provider, and fires on any error code where Android fires only on a user reject."

# Token info

[enums.TokenInfoSource]
doc = "Where Token Info was opened from. Discovery, Chat and Chat Gate are new in part 1; Android previously sent Wallet for all three. iOS's Give and Send sources stay native until part 2."

[enums.TokenInfoSource.cases]
DEEPLINK = "Deeplink"
WALLET = "Wallet"
DISCOVERY = "Discovery"
CHAT = "Chat"
CHAT_GATE = "Chat Gate"

[[domains.TokenInfoEvents.events]]
builder = "opened"
event = "Token Info: Opened From {source}"
params = ["source: TokenInfoSource", "mint: String"]
properties = [{ key = "Mint", value = "mint" }]

# Swap

[enums.PurchaseMethod.cases]
RESERVES = "Reserves"
PHANTOM = "Phantom"
COINBASE = "Coinbase"

[domains.SwapEvents]
doc = "Buying and selling a token."

[[domains.SwapEvents.events]]
builder = "purchase"
event = "Token Purchase With {method}"
params = ["method: PurchaseMethod", "mint: String", "amount: Amount", "error: String?"]
properties = [
  { key = "Mint", value = "mint" },
  { group = "amount" },
  { key = "Error", value = "error" },
]
doc = "Phantom and Coinbase are Android only; part 2 decides whether iOS sends them."
drift = "(Reserves) iOS also sends State, Payment Mint and Payment Token Symbol, and sends only Fiat and Currency of the amount, with no USDC or Quarks."

[[domains.SwapEvents.events]]
builder = "sell"
event = "Token Sell"
params = ["mint: String", "amount: Amount", "fee: Double", "error: String?"]
properties = [
  { key = "Mint", value = "mint" },
  { group = "amount" },
  { key = "Fee", value = "fee" },
  { key = "Error", value = "error" },
]
drift = "iOS also sends State, and sends only Fiat and Currency of the amount, with no USDC, Quarks or Fee."

appId: com.flipcash.app.android
name: "Send to a Flipcash contact"
tags:
  - payments
---
# Send cash to an on-Flipcash contact, then land in the conversation. Mirrors iOS
# SendSmokeTests (which sends to a fixed contact, "Raul Riera").
#
# Requires (see README "Two phone-verification paths"):
#   - a send-enabled account: a phone linked via the emulator's real number + real SMS
#     (`adb emu sms send`), not the onboarding test number — else the flow stops at the phone gate;
#   - the CONTACT_NAME / CONTACT_PHONE contact (a real Flipcash user) in the emulator's contacts —
#     the runner seeds this automatically.
# Until the account is phone-linked this is a scaffold — the steps encode the expected journey.
- runFlow: subflows/login_with_deeplink.yaml

- tapOn: "Send"
- extendedWaitUntil: { visible: { id: send_screen }, timeout: 8000 }

# With a linked phone the send flow shows the contact list (not the phone gate).
- extendedWaitUntil: { visible: { id: send_contact_list }, timeout: 8000 }
- tapOn: { id: send_search_field }
- inputText: ${CONTACT_NAME}
- extendedWaitUntil: { visible: { id: send_contact_row }, timeout: 8000 }
- tapOn: { id: send_contact_row, index: 0 }

# Opening a Flipcash contact lands in the conversation (from which cash/amount is entered).
- extendedWaitUntil: { visible: { id: chat_screen }, timeout: 8000 }

appId: com.flipcash.app.android
name: "Token Discovery — leaderboard → token info"
tags:
  - smoke
  - tokens
---
# Deterministic clean login → home.
- runFlow: subflows/login_with_deeplink.yaml

# Open Discover and assert the leaderboard rendered.
- runFlow: subflows/navigate_to_discovery.yaml
- assertVisible:
    id: discovery_leaderboard
- assertVisible:
    id: leaderboard_token_row

# Drill into the top token's info screen.
- tapOn:
    id: leaderboard_token_row
    index: 0
- extendedWaitUntil:
    visible:
      id: token_info_screen
    timeout: 8000

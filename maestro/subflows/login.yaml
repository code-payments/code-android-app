# Login
appId: com.flipcash.app.android
---
- tapOn: Log in
- extendedWaitUntil:
      visible:
          id: seed_input_screen
- tapOn: 
    id: "seed_input_field"
- inputText: ${SEED_PHRASE}
- tapOn: Log in
# A seed login with no deeplink lands on the Chats tab (AppRoute.Tabs.Chats).
- extendedWaitUntil:
      visible:
          id: "chats_screen"

# Create a fresh account through onboarding, for flows that must run on a brand-new
# account (e.g. one-run-per-account setup). Sets the display name "Test User" during
# onboarding. Enables beta flags at launch via BETA_FLAGS (comma-separated
# FeatureFlag.key list; debug builds only).
appId: com.flipcash.app.android
---
- clearState
- launchApp:
    arguments:
      isUiTest: true
      betaFlags: ${BETA_FLAGS}

- extendedWaitUntil: { visible: { id: login_screen }, timeout: 15000 }
- tapOn: { id: create_account_button }

# Access key — take the "wrote it down" path (confirm the dialog).
- extendedWaitUntil: { visible: { id: access_key_screen }, timeout: 15000 }
- tapOn: "Wrote the 12 Words Down Instead?"
- tapOn: "Wrote the 12 Words Down Instead?"

# Display name entry (follows the access key).
- extendedWaitUntil: { visible: { id: name_screen }, timeout: 15000 }
- tapOn: { text: "Your Name" }
- inputText: "Test User"
- tapOn: "Next"

# A push-notification permission dialog appears only if it isn't already granted.
- tapOn:
    text: "Allow"
    optional: true

- extendedWaitUntil: { visible: { id: scanner_screen }, timeout: 20000 }

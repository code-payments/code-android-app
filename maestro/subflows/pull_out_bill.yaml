appId: com.flipcash.app.android
---
- runFlow: navigate_to_give.yaml
# The give screen is seeded with the currency it was opened from, so it opens on Float.
- extendedWaitUntil:
      visible: Float
- extendedWaitUntil:
      visible:
        id: "keypad_dot"
- tapOn: 
    id: "keypad_dot"
- tapOn: 
    id: "keypad_0"
- tapOn: 
    id: "keypad_1"
- assertVisible:
    text: "Next"
    enabled: true
- tapOn: Next
- extendedWaitUntil:
      visible:
        id: cash_bill

appId: com.flipcash.app.android
---
- runFlow: ../helpers/close_open_sheet.yaml
# The give/cash nav button's label is config-driven (GiveButtonLabel: "Give" or "Cash");
# it currently renders "Cash" (action_cash).
- tapOn: Cash
- extendedWaitUntil:
      visible: Float
- extendedWaitUntil:
      visible:
        id: "keypad_dot"
- tapOn: 
    id: "keypad_dot"
- tapOn: 
    id: "keypad_0"
- tapOn: 
    id: "keypad_1"
- assertVisible:
    text: "Next"
    enabled: true
- tapOn: Next
- extendedWaitUntil:
      visible:
        id: cash_bill

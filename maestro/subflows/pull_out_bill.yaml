appId: com.flipcash.app.android.dev
---
- runFlow: ../helpers/close_open_sheet.yaml
- tapOn: Give
- extendedWaitUntil:
      visible: Float
- extendedWaitUntil:
      visible:
        id: "keypad_dot"
- tapOn: 
    id: "keypad_dot"
- tapOn: 
    id: "keypad_0"
- tapOn: 
    id: "keypad_1"
- assertVisible:
    text: "Next"
    enabled: true
- tapOn: Next
- extendedWaitUntil:
      visible:
        id: cash_bill

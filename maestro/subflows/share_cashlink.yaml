appId: com.flipcash.app.android
---
- tapOn: Send as a Link
# we need maestro to gain access to the content as well
- copyTextFrom:
    id: content_preview_text 
# trigger copy flow
- tapOn:
    id: copy
- waitForAnimationToEnd
# The confirm prompt slides in over the bill, so wait it out rather than tapping mid-animation.
- extendedWaitUntil:
    visible: ".*Yes.*"
    timeout: 8000
- tapOn: 
    text: ".*Yes.*"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: true

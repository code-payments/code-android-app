appId: com.flipcash.app.android
---
- stopApp
- runFlow: 
    file: ../helpers/launch_deeplink.yaml
    env:
      clearAppState: "true"
      deeplink: ${LOGIN_DEEPLINK}

# A cold launch opens on the Chats tab (#1529), not the Wallet or the camera.
- extendedWaitUntil:
      visible:
          id: "chats_screen"

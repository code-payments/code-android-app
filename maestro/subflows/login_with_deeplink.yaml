appId: com.flipcash.app.android
---
- stopApp
- runFlow: 
    file: ../helpers/launch_deeplink.yaml
    env:
      clearAppState: "true"
      deeplink: ${LOGIN_DEEPLINK}

# Launch lands on the Wallet tab, not the camera (homeRoute = AppRoute.Tabs.Wallet).
- extendedWaitUntil:
      visible:
          id: "wallet_screen"

# Menu → Withdraw Money → (USDC path) → amount entry.
appId: com.flipcash.app.android
---
- runFlow: navigate_to_menu.yaml
- tapOn: "Withdraw Money"
- extendedWaitUntil:
    visible:
      id: withdrawal_screen
    timeout: 8000
- tapOn: "Withdraw as USDC"
- tapOn: "Next"
- extendedWaitUntil:
    visible:
      id: withdraw_entry_screen
    timeout: 8000

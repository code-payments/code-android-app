# Opens leaderboard row ${ROW} and, if that currency offers "Get", enters the buy flow.
# "Get" is only offered on a currency the account does NOT hold, and the leaderboard is live
# data, so the caller walks the first few rows until one lands on swap_screen.
appId: com.flipcash.app.android
---
- tapOn:
    id: leaderboard_token_row
    index: ${ROW}
- extendedWaitUntil:
    visible:
      id: token_info_screen
    timeout: 8000

- runFlow:
    when:
      visible: "^Get$"
    commands:
      - tapOn: "^Get$"
      - extendedWaitUntil:
          visible:
            id: swap_screen
          timeout: 8000

# Held currency — back out and let the caller try the next row.
- runFlow:
    when:
      notVisible:
        id: swap_screen
    commands:
      - back
      - extendedWaitUntil:
          visible:
            id: discovery_screen
          timeout: 8000

# Unlocks the staff/beta-only rows (Switch Accounts, and the rest) for a non-staff test account,
# the same way a human does it: seven taps on the version footer at the bottom of the menu.
#
# `betaFlags` as a launch argument only flips individual FeatureFlag keys; it does not set the
# beta override, which is what gates StaffMenuItem rows. This is the only route to that override.
appId: com.flipcash.app.android
---
- runFlow: navigate_to_menu.yaml
- scrollUntilVisible:
    element:
      text: "Version .*"
    direction: DOWN
    timeout: 20000
- repeat:
    times: 7
    commands:
      - tapOn:
          text: "Version .*"

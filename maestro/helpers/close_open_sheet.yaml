appId: com.flipcash.app.android
---
# Return to the scanner tab — the common starting point for the flows.
#
# Navigation is tab-centric: the four tabs are swapped on a single root backstack, so the scanner is
# NOT a root that Back unwinds to. Back only pops whatever detail screen or sheet sits above the
# CURRENT tab, and pressing it at a tab home would leave the app. So this is two phases:
#
#   1. Back until the nav bar is showing again (its scanner tab is the probe) — i.e. until whatever
#      detail/sheet was open has been dismissed and a tab home is on top. Bounded (times) rather
#      than an open while-loop so a stuck sheet can't hang CI, and each Back is guarded on the bar
#      not already showing, so this is a safe no-op on a clean tab home and never exits the app.
#   2. Tap the scanner tab, unless the scanner is already the current tab.
#
# One thing precedes both: a wallet card opened as an EXPANDED overlay (v2's card-expand) is not a
# nav entry, and the nav bar stays in the hierarchy behind it (merely faded out) — so the tab probe
# below can't tell it apart from a clean tab home. Collapse it explicitly first. The same guard also
# pops a PUSHED currency-info screen, which is equally correct.
- runFlow:
    when:
      visible:
        id: token_info_screen
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            notVisible:
              id: nav_scanner
          commands:
            - pressKey: Back
            - waitForAnimationToEnd:
                timeout: 1500
- runFlow:
    when:
      notVisible:
        id: scanner_screen
    commands:
      - tapOn:
          id: nav_scanner
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible:
    id: scanner_screen

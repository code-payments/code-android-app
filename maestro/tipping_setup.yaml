appId: com.flipcash.app.android
name: "Tipping — create account & set up tip card"
tags:
  - tipping
---
# Tip setup is one-run-per-account, so start from a brand-new account with the tipping
# beta flag enabled at launch (no Labs-UI toggling).
- runFlow:
    file: subflows/create_account.yaml
    env:
      BETA_FLAGS: "tipping_enabled"

# Tipping is enabled -> the Tips tab is present.
- assertVisible: "Tips"
- tapOn: "Tips"
- extendedWaitUntil: { visible: { id: tips_screen }, timeout: 8000 }

# Set up the tip card: name is the next step.
- tapOn: "Start Receiving Tips"
- extendedWaitUntil: { visible: { id: name_screen }, timeout: 8000 }
- tapOn: { text: "Your Name" }
- inputText: "Test Tipper"
- tapOn: "Next"

# The tip card renders with the chosen name.
- extendedWaitUntil: { visible: { id: tip_card_screen }, timeout: 8000 }
- assertVisible: "My Tip Card"
- assertVisible: "Tip Test Tipper"

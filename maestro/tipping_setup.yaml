appId: com.flipcash.app.android
name: "Tipping — create account & set up tip card"
tags:
  - tipping
  - creates-account
---
# Tip setup is one-run-per-account, so start from a brand-new account.
- runFlow:
    file: subflows/create_account.yaml
    env:
      BETA_FLAGS: ""

# Tipping is on by default -> the chats tab is present.
- assertVisible: { id: nav_chats }
- tapOn: { id: nav_chats }
- extendedWaitUntil: { visible: { id: tips_screen }, timeout: 8000 }

# The display name is captured during onboarding, so tip setup lands directly on the
# Tips list — no name step here. Open the tip card from the list.
- tapOn: "Show My Tip Card"

# The tip card renders with the display name set during onboarding.
- extendedWaitUntil: { visible: { id: tip_card_screen }, timeout: 8000 }
- assertVisible: "My Tip Card"
- assertVisible: "Tip Test User"

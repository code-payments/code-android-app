appId: com.flipcash.app.android
name: "Account & Settings Navigation"
tags:
  - smoke
  - account
---
# Deterministic clean login → home.
- runFlow: subflows/login_with_deeplink.yaml

# Menu → Settings (the gear)
- runFlow: subflows/navigate_to_settings.yaml

# Back to the menu.
- tapOn:
    id: action_back
- extendedWaitUntil:
    visible:
      id: menu_screen
    timeout: 10000

appId: com.flipcash.app.android
name: "Deposit (Add Money) → USDC"
tags:
  - smoke
  - deposit
---
# Fund-safe: opens the Add Money method sheet and enters the USDC deposit flow.
- runFlow: subflows/login_with_deeplink.yaml
# Add Money is a wallet action tile now, below the card deck and recent activity.
- runFlow: subflows/navigate_to_wallet.yaml
- scrollUntilVisible:
    element: "Add Money"
    direction: DOWN

- tapOn: "Add Money"
- extendedWaitUntil:
    visible:
      text: "Add Money With"
    timeout: 8000
- tapOn: "Other Wallet"
- extendedWaitUntil:
    visible:
      id: deposit_screen
    timeout: 8000
- assertVisible: "Deposit USDC"

appId: com.flipcash.app.android
name: "Deposit (Add Money) → USDC"
tags:
  - smoke
  - deposit
---
# Fund-safe: opens the Add Money method sheet and enters the USDC deposit flow.
- runFlow: subflows/login_with_deeplink.yaml
# Add Dollars is a wallet action tile now, below the card deck and recent activity.
- runFlow: subflows/navigate_to_wallet.yaml
- runFlow:
    file: helpers/scroll_wallet_to_tile.yaml
    env:
      TILE: "Add Dollars"

- runFlow:
    file: helpers/tap_wallet_tile.yaml
    env:
      TILE: "Add Dollars"
- extendedWaitUntil:
    visible:
      text: "Add Dollars With"
    timeout: 8000
- tapOn: "Other Wallet"
- extendedWaitUntil:
    visible:
      id: deposit_screen
    timeout: 8000
- assertVisible: "Deposit USDC"

appId: com.flipcash.app.android
name: "Get — discovery → token info → confirm (fund-safe)"
tags:
  - smoke
  - swap
---
# Fund-safe: drives the buy flow to the confirmation screen and stops (never confirms).
#
# The direct buy is a "Buy In" tile on a currency the account does not hold and "Buy More" on
# one it does (it was "Get" before #1341); it opens the same swap flow, titled by the screen
# as "You Get" on the receipt. This enters through Discover rather than the wallet's own deck.
#
# The payment currency is also picked inline on the amount screen now (seeded with a default),
# so there is no pushed "Select Payment Currency" step between the amount and the receipt.
- runFlow: subflows/login_with_deeplink.yaml
- runFlow: subflows/navigate_to_discovery.yaml

# The leaderboard is live data, so which rows the account already holds varies. Walk the
# first few until one offers Get; each attempt backs out of a held currency's info screen.
- runFlow:
    file: subflows/try_get_from_leaderboard.yaml
    env:
      ROW: "0"
- runFlow:
    when: { notVisible: { id: swap_screen } }
    file: subflows/try_get_from_leaderboard.yaml
    env:
      ROW: "1"
- runFlow:
    when: { notVisible: { id: swap_screen } }
    file: subflows/try_get_from_leaderboard.yaml
    env:
      ROW: "2"
- runFlow:
    when: { notVisible: { id: swap_screen } }
    file: subflows/try_get_from_leaderboard.yaml
    env:
      ROW: "3"
- assertVisible:
    id: swap_screen

# Minimal amount, then straight to the receipt (funding source is already seeded).
- tapOn: { id: keypad_1 }
- tapOn: "Next"

# Confirmation — assert and stop (do not confirm the purchase).
- extendedWaitUntil: { visible: { id: buy_receipt_screen }, timeout: 8000 }
- assertVisible: "You Get"

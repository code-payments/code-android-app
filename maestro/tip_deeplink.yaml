appId: com.flipcash.app.android
name: "Profile card deeplink — lands on the person's profile"
tags:
  - tipping
---
# Seed-login. A fresh login clears local state, so give balances a moment to sync
# (opening the Wallet forces the token balances to load) before opening the deeplink.
- runFlow:
    file: subflows/login_with_flags.yaml
    env:
      BETA_FLAGS: ""
- runFlow: subflows/navigate_to_wallet.yaml
- assertVisible: { id: wallet_screen }

# Open the profile card deeplink -> the card holds for its reveal beat, then the person's profile
# takes over (a DM is only opened from the profile, whether or not one exists yet). Wait on the
# name rather than on the card, which shows it too, with a timeout that clears the reveal.
- openLink: ${TIPCARD_DEEPLINK}
- extendedWaitUntil:
    visible: "Brandon McAnsh"
    timeout: 12000

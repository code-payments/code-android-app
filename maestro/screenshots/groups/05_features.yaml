appId: com.flipcash.app.android
name: "Screenshots: Settings (bottom)"
tags:
  - screenshot
---
- runFlow: ../../subflows/login_with_deeplink.yaml

# Screenshot: the lower half of Settings, past the account rows.
- runFlow: ../../subflows/navigate_to_settings.yaml
- scrollUntilVisible:
    element:
      text: "Version .*"
    direction: DOWN
    timeout: 20000
- runFlow:
    file: ../../helpers/screenshot.yaml
    env:
      SCREENSHOT_NAME: settings_bottom_screen

# Return to scanner
- runFlow: ../../subflows/return_to_scanner.yaml

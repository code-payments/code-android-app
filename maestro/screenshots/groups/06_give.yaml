appId: com.flipcash.app.android
name: "Screenshots: Give Flow"
tags:
  - screenshot
---
- runFlow: ../../subflows/login_with_deeplink.yaml

# Screenshot: Cash/Give screen (keypad)
- runFlow: ../../subflows/navigate_to_give.yaml
- runFlow:
    file: ../../helpers/screenshot.yaml
    env:
      SCREENSHOT_NAME: cash_screen

# Screenshot: Cash bill. Already on the give screen, so drive the keypad in place rather than
# re-entering through pull_out_bill (which would navigate here all over again).
- tapOn:
    id: "keypad_dot"
- tapOn:
    id: "keypad_0"
- tapOn:
    id: "keypad_1"
- tapOn: Next
- extendedWaitUntil:
    visible:
      id: cash_bill
- runFlow:
    file: ../../helpers/screenshot.yaml
    env:
      SCREENSHOT_NAME: cash_bill

# Put the bill back. The give screen pops itself once the bill is presented, so cancelling
# reveals the currency-info screen it was opened from.
- tapOn: Cancel
- extendedWaitUntil:
    visible:
      id: token_info_screen
- runFlow: ../../helpers/close_open_sheet.yaml

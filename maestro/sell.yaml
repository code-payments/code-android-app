appId: com.flipcash.app.android
name: "Convert — token info → amount entry (fund-safe)"
tags:
  - smoke
  - swap
---
# Fund-safe: reaches the convert amount-entry. Reaching the convert confirmation depends on
# the held balance clearing the minimum + fees, so it's left for a funded account.
#
# v2 has no standalone "Sell": liquidating a currency is a Convert into another one (Dollars
# by default), reached from the held currency's own info screen.
- runFlow: subflows/login_with_deeplink.yaml
- runFlow: subflows/open_token_info.yaml

- tapOn: "Convert"
- extendedWaitUntil: { visible: { id: swap_screen }, timeout: 8000 }
- assertVisible: { id: keypad_5 }

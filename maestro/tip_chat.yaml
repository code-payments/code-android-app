appId: com.flipcash.app.android
name: "Tip chat — open conversation & send a message"
tags:
  - tipping
---
# Seed-login into the test account (which has tips set up + a tip chat).
- runFlow:
    file: subflows/login_with_flags.yaml
    env:
      BETA_FLAGS: ""
- runFlow: subflows/open_tip_chat.yaml

# Send a message and confirm it lands in the transcript.
- tapOn: { id: chat_message_input }
- inputText: "gg"
- tapOn: { id: chat_send_icon }
- extendedWaitUntil: { visible: { text: "gg" }, timeout: 8000 }

# A tip event is present in the conversation. Which way it went is live data, so match either.
# Scrolled to rather than asserted in place: the transcript is shared and append-only, so every
# run of this flow and the chat-action flows pushes the tip events further up it. Last, because
# the send above needs the list at the bottom where it opened.
- scrollUntilVisible:
    element: "You tipped|You received a tip"
    direction: UP

appId: com.flipcash.app.android
name: "Tip chat — open conversation & send a message"
tags:
  - tipping
---
# Seed-login into the test account (which has tips set up + a tip chat).
- runFlow:
    file: subflows/login_with_flags.yaml
    env:
      BETA_FLAGS: ""

# The chats tab lists tip conversations. Open the contact's by name: the list is ordered by
# recency and carries the account's own self-tip chat, so index 0 is not stably the contact.
- tapOn: { id: nav_chats }
- extendedWaitUntil: { visible: { id: tips_screen }, timeout: 8000 }
- assertVisible: { id: send_contact_row }
- scrollUntilVisible:
    element: "${CONTACT_NAME}"
    direction: DOWN
- tapOn: "${CONTACT_NAME}"

# In the tip conversation: a tip event and the message composer are present. Which way the tip
# went is live data, so match either direction.
- extendedWaitUntil: { visible: { id: chat_screen }, timeout: 8000 }
- assertVisible: { id: chat_message_input }
- assertVisible: "You tipped|You received a tip"

# Send a message and confirm it lands in the transcript.
- tapOn: { id: chat_message_input }
- inputText: "gg"
- tapOn: { id: chat_send_icon }
- extendedWaitUntil: { visible: { text: "gg" }, timeout: 8000 }

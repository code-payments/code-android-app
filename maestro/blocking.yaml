appId: com.flipcash.app.android
name: "Blocking — block & unblock a chat participant"
tags:
  - blocklist
---
# Tipping and blocking are on by default; no beta flags needed to reach the tip chat.
- runFlow:
    file: subflows/login_with_flags.yaml
    env:
      BETA_FLAGS: ""

# Open the tip conversation (the chats tab).
- tapOn: { id: nav_chats }
- extendedWaitUntil: { visible: { id: tips_screen }, timeout: 8000 }
# Pick the chat by participant rather than by position: the list is ordered by recency and
# carries the account's own self-tip chat, so index 0 is not stably the contact.
- scrollUntilVisible:
    element: "${CONTACT_NAME}"
    direction: DOWN
- tapOn: "${CONTACT_NAME}"
- extendedWaitUntil: { visible: { id: chat_screen }, timeout: 8000 }

# Open the participant's profile from the chat header and block them.
- tapOn: { text: "${CONTACT_NAME}", index: 0 }
- extendedWaitUntil: { visible: { id: profile_screen }, timeout: 8000 }
- tapOn: "Block"
- assertVisible: "Block ${CONTACT_NAME}?"
- tapOn: { text: "^Block$" }
- extendedWaitUntil: { visible: { id: tips_screen }, timeout: 8000 }

# Verify they appear in My Account -> Blocked. Chats is a root tab, so the You tab is one tap
# away rather than behind a sheet dismiss.
- tapOn: { id: nav_tipcard }
- extendedWaitUntil: { visible: { id: menu_screen }, timeout: 8000 }
# The You tab leads with the tip card, so the list rows sit below the fold.
- scrollUntilVisible:
    element: "My Account"
    direction: DOWN
- tapOn: "My Account"
- extendedWaitUntil: { visible: { id: my_account_screen }, timeout: 8000 }
- tapOn: "Blocked"
- extendedWaitUntil: { visible: { id: blocklist_screen }, timeout: 8000 }
- assertVisible: "${CONTACT_NAME}"

# Unblock to restore the account to a clean state.
- tapOn: "${CONTACT_NAME}"
- assertVisible: "Unblock ${CONTACT_NAME}?"
- tapOn: { text: "^Unblock$" }
- assertVisible: "No One Blocked"
